        const estokSelect = document.getElementById('select-pwodwi-estok');

        const valTrans = transSelect.value;

        let html = "";
        Object.values(lokalState.inventory).forEach(p => {
            html += `<option value="${p.id}">${p.name}</option>`;
        });

        estokSelect.innerHTML = html;
        transSelect.innerHTML = html;

        if (valEstok) estokSelect.value = valEstok;
        if (valTrans) transSelect.value = valTrans;
    }

    function majEkranAdmin() {
        // Balans Kès yo
        document.getElementById('disp-kes-frijide').innerText = (lokalState.stokBwasonFrijidè ?? 0).toLocaleString('en-US') + " HTG";
        document.getElementById('disp-kes-gro').innerText = (lokalState.stokVenteEnGro ?? 0).toLocaleString('en-US') + " HTG";
        document.getElementById('disp-nat-cash').innerText = (lokalState.kobfiziknatcash ?? 0).toLocaleString('en-US') + " HTG";

        // Kalkile Benefis ak Komisyon NatCash
        let komiAkimile = lokalState.accumulatedCommission ?? 0;
        let totalKomi = komiAkimile;
        let komiDepo = lokalState.totalKomisyonDepo ?? 0;
        let komiRetre = lokalState.totalKomisyonRetre ?? 0;

        document.getElementById('disp-komisyon').innerText = totalKomi.toLocaleString('en-US') + " HTG";
        document.getElementById('sub-kom-depo').innerText = komiDepo.toFixed(2);
        document.getElementById('sub-kom-retre').innerText = komiRetre.toFixed(2);

        let benDetay = lokalState.benefisDetay ?? 0;
        let benGro = lokalState.benefisGro ?? 0;
        let totalBen = benDetay + benGro;
        document.getElementById('disp-benefis').innerText = totalBen.toLocaleString('en-US') + " HTG";
        document.getElementById('sub-ben-detay').innerText = benDetay.toLocaleString('en-US');
        document.getElementById('sub-ben-gro').innerText = benGro.toLocaleString('en-US');

        // Dinamik: Kalkile Valè Estok total nan gwo Depo a baze sou 31 pwodwi nan inventory yo
        let valeEstokTotal = 0;
        let tblBodyHtml = "";

        if (lokalState.inventory) {
            Object.values(lokalState.inventory).forEach(p => {
                let stkWandis = p.stockGrenn ?? 0;
                let stkFriz = p.stockFrizerGrenn ?? 0;
                let kèsPri = p.prices?.kes ?? 0;
                
                // Valè estok la kalkile sou kòb kès depo a vaut
                valeEstokTotal += (stkWandis / 24) * kèsPri;

                let kesDepoKalkile = (stkWandis / 24).toFixed(1);

                tblBodyHtml += `
                    <tr>
                        <td><strong>${p.name}</strong></td>
                        <td><span class="badge badge-depot">${stkWandis} gr</span></td>
                        <td><span class="badge badge-frizer">${stkFriz} gr</span></td>
                        <td>${kesDepoKalkile} kès</td>
                    </tr>
                `;
            });
        }
        document.getElementById('disp-vale-estok').innerText = valeEstokTotal.toLocaleString('en-US', {maximumFractionDigits: 2}) + " HTG";
        document.getElementById('tbl-stock-body').innerHTML = tblBodyHtml || `<tr><td colspan="4" style="text-align:center;">Pa gen pwodwi ki disponib.</td></tr>`;

        // Alèt yo
        const alertBox = document.getElementById('admin-alert');
        if (lokalState.kontestasyonKès) {
            alertBox.style.display = 'block';
            alertBox.innerHTML = `⚠️ <strong>ALÈT KONTESTASYON MATEN:</strong> Vandè a deklare li jwenn <strong>${lokalState.kontestasyonKès.kòbMounNanWè} HTG</strong> olye de <strong>${lokalState.kontestasyonKès.kòbSistèm} HTG</strong> nan kès NatCash la!`;
        } else if (lokalState.clotureAveg) {
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = 'rgba(245, 158, 11, 0.1)';
            alertBox.style.borderColor = 'var(--warning)';
            alertBox.style.color = 'var(--warning)';
            alertBox.innerHTML = `🏁 <strong>RAPÒ FÈMTI KÈS AVÈG VANDÈ:</strong><br>
                - Kòb Ti Glase li wè: ${lokalState.clotureAveg.frijideVedi ?? 0} HTG (Sistèm: ${lokalState.stokBwasonFrijidè ?? 0} HTG)<br>
                - Kòb En Gwo li wè: ${lokalState.clotureAveg.groVedi ?? 0} HTG (Sistèm: ${lokalState.stokVenteEnGro ?? 0} HTG)<br>
                - Kòb NatCash Kach li wè: ${lokalState.clotureAveg.natVedi ?? 0} HTG (Sistèm: ${lokalState.kobfiziknatcash ?? 0} HTG)`;
        } else {
            alertBox.style.display = 'none';
        }

        aficheEstatistik();
        ranpliIstorikEkran();
    }

    window.retireKòbAdmin = function() {
        let kès = document.getElementById('select-retre-kes').value;
        let montan = parseFloat(document.getElementById('input-retre-montan').value);
        let rezon = document.getElementById('input-retre-motive').value || "Retrè Admin";

        if (isNaN(montan) || montan <= 0) { alert("Antre yon montan valab!"); return; }
        if ((lokalState[kès] ?? 0) < montan) { alert("Pa gen ase kòb nan kès sa a!"); return; }

        let nouvoVal = lokalState[kès] - montan;
        let pouseRef = ref(db, `appState/istorikAdminRetre`);
        push(pouseRef, {
            dat: new Date().toLocaleDateString(),
            tan: new Date().toLocaleTimeString(),
            kès: kès,
            montan: montan,
            rezon: rezon
        });

        let updateObj = {};
        updateObj[kès] = nouvoVal;

        if (lokalState.physicalCashBalance !== undefined) {
            updateObj["physicalCashBalance"] = Math.max(0, lokalState.physicalCashBalance - montan);
        }

        update(appRef, updateObj);

        alert(`Siksè! Ou tire ${montan} HTG nan kès la.`);
        document.getElementById('input-retre-montan').value = '';
        document.getElementById('input-retre-motive').value = '';
    };

    // JESTYON METE NOUVO ESTOK NAN DEPO
    window.ajouteEstokAdmin = function() {
        let pId = document.getElementById('select-pwodwi-estok').value;
        let inite = document.getElementById('select-inite-estok').value;
        let inputKantite = document.getElementById('input-kantite-bwat');
        let kantite = parseFloat(inputKantite.value);

        if (!pId || isNaN(kantite) || kantite <= 0) { 
            alert("Antre yon kantite valab!"); 
            return; 
        }

        let grennPouAjoute = 0;
        if (inite === "kes") {
            grennPouAjoute = kantite * 24;
        } else if (inite === "demi") {
            grennPouAjoute = kantite * 12;
        } else if (inite === "grenn") {
            grennPouAjoute = kantite;
        }

        if (!lokalState.inventory || !lokalState.inventory[pId]) { 
            alert("Pwodwi sa a pa jwenn nan baz done a!"); 
            return; 
        }

        let stòkKounye  = lokalState.inventory[pId].stockGrenn ?? 0;
        let nouvoStokGrenn = stòkKounye  + grennPouAjoute;
        let nonPwodwi = lokalState.inventory[pId].name;

        let updateObj = {};
        updateObj[`inventory/${pId}/stockGrenn`] = nouvoStokGrenn;

        update(appRef, updateObj)
            .then(() => {
                alert(`Siksè! Nouvo estok pou ${nonPwodwi.toUpperCase()} la sove nan Depo a.`);
                inputKantite.value = '';
            })
            .catch((error) => {
                alert("Gen yon erè ki rive: " + error.message);
            });
    };

    function aficheEstatistik() {
        let stats = lokalState.lavantKonte ?? {};
        let container = document.getElementById('stats-container');
        
        let maxVant = Math.max(...Object.values(stats), 1); 
        let html = "";

        if (lokalState.inventory) {
            Object.values(lokalState.inventory).forEach(p => {
                let kantiteVann = stats[p.id] ?? stats[p.name.toLowerCase()] ?? 0;
                let pousantaj = (kantiteVann / maxVant) * 100;

                if (kantiteVann > 0) {
                    html += `
                        <div class="stat-row">
                            <div class="stat-label">${p.name}</div>
                            <div class="stat-progress-bg">
                                <div class="stat-progress-fill" style="width: ${pousantaj}%;"></div>
                            </div>
                            <div class="stat-count">${kantiteVann}</div>
                        </div>
                    `;
                }
            });
        }
        container.innerHTML = html || "Pa gen vant ki fèt pou jounen an ankò.";
    }

    function ranpliIstorikEkran(datFiltre = "") {
        let tGlaseBox = document.getElementById('log-ti-glase');
        let enGroBox = document.getElementById('log-en-gro');
        let natBox = document.getElementById('log-natcash');

        if (lokalState.lisTranzaksyonDetay) {
            let items = Object.values(lokalState.lisTranzaksyonDetay);
            if (datFiltre) items = items.filter(i => i.dat === datFiltre);
            tGlaseBox.innerHTML = items.map(i => `<div class="log-item">⏰ ${i.tan} - ${i.mesaj}</div>`).join('') || "Pa gen lavant...";
        } else { tGlaseBox.innerHTML = "Pa gen lavant..."; }

        if (lokalState.logsAnGwo) {
            if (typeof lokalState.logsAnGwo === "string") {
                enGroBox.innerHTML = lokalState.logsAnGwo || "Pa gen lavant...";
            } else {
                let items = Object.values(lokalState.logsAnGwo);
                if (datFiltre) items = items.filter(i => i.dat === datFiltre);
                enGroBox.innerHTML = items.map(i => `<div class="log-item">⏰ ${i.tan} - ${i.mesaj}</div>`).join('') || "Pa gen lavant...";
            }
        } else { enGroBox.innerHTML = "Pa gen lavant..."; }

        if (lokalState.lisTranzaksyon) {
            let items = Object.values(lokalState.lisTranzaksyon);
            if (datFiltre) items = items.filter(i => i.dat === datFiltre);
            natBox.innerHTML = items.map(i => `<div class="log-item">⏰ ${i.tan} - ${i.mesaj}</div>`).join('') || "Pa gen tranzaksyon...";
        } else { natBox.innerHTML = "Pa gen tranzaksyon..."; }
    }

    window.filtreIstorik = function() {
        let datChwazi = document.getElementById('filtre-dat').value;
        if (!datChwazi) { ranpliIstorikEkran(); return; }
        let datObj = new Date(datChwazi + "T00:00:00");
        ranpliIstorikEkran(datObj.toLocaleDateString());
    };

    window.femenJounenOfisyel = function() {
        if (!confirm("Èske ou sèten ou vle fèmen jounen an ofisyèlman? Sa ap reset kontè benefis ak lavant yo!")) return;

        let achivRef = ref(db, "achivLavant");
        let nouvoRapò = {
            dat: new Date().toLocaleDateString(),
            benefisPwofi: (lokalState.benefisDetay ?? 0) + (lokalState.benefisGro ?? 0),
            komisyonNatCash: (lokalState.totalKomisyonDepo ?? 0) + (lokalState.totalKomisyonRetre ?? 0),
            kèsFèmtiFrijidè: lokalState.stokBwasonFrijidè ?? 0,
            kèsFèmtiGro: lokalState.stokVenteEnGro ?? 0,
            kèsFèmtiNatCash: lokalState.kobfiziknatcash ?? 0
        };

        push(achivRef, nouvoRapò);

        let resetLavantKonte = {};
        if (lokalState.inventory) {
            Object.keys(lokalState.inventory).forEach(id => {
                resetLavantKonte[id] = 0;
            });
        }

        update(appRef, {
            benefisDetay: 0,
            benefisGro: 0,
            totalKomisyonDepo: 0,
            totalKomisyonRetre: 0,
            lavantKonte: resetLavantKonte,
            clotureAveg: null,
            kontestasyonKès: null
        });

        alert("🏁 Jounen an fèmen epi achive avèk siksè! Tout bagay pròp pou demen.");
    };

    window.checkPin = function() {
        let pin = document.getElementById('admin-pin').value;
        if (pin === "1234") {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        } else {
            alert("❌ Kòd Sekirite a Enkorèk! Eseye ankò.");
            document.getElementById('admin-pin').value = '';
        }
    };
</script>
