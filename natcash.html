<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA76yMMRz0VgcoywUJNvgdP3h4l7S6Xogk",
        authDomain: "bwdepot-61214.firebaseapp.com",
        databaseURL: "https://bwdepot-61214-default-rtdb.firebaseio.com",
        projectId: "bwdepot-61214",
        storageBucket: "bwdepot-61214.firebasestorage.app",
        messagingSenderId: "624010872324",
        appId: "1:624010872324:web:0b0565c3872b3caccd5751",
        measurementId: "G-8VEN9QQF7B"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const natcashRef = ref(db, "appState");

    let natcashCardBalance = 0.00;
    let kobfiziknatcash = 0.00;
    let stokBwasonFrijidè = 0.00;
    let stokVenteEnGro = 0.00;

    let accumulatedCommission = 0.00; 
    let totalKomisyonDepo = 0.00;
    let totalKomisyonRetre = 0.00;
    let lisTranzaksyon = [];

    // Inisyalizasyon Theme nan kòmansman an
    if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        const themeBtn = document.getElementById('theme-btn');
        if (themeBtn) themeBtn.innerText = "🌙 Lannwit";
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const themeBtn = document.getElementById('theme-btn');
        if (currentTheme === 'dark') {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            if (themeBtn) themeBtn.innerText = "☀️ Lajounen";
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            if (themeBtn) themeBtn.innerText = "🌙 Lannwit";
        }
    }

    onValue(natcashRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            natcashCardBalance = data.natcashCardBalance ?? 0.00;
            kobfiziknatcash = data.kobfiziknatcash ?? 0.00;
            stokBwasonFrijidè = data.stokBwasonFrijidè ?? 0.00;
            stokVenteEnGro = data.stokVenteEnGro ?? 150000.00;
            accumulatedCommission = data.accumulatedCommission ?? 0.00;
            totalKomisyonDepo = data.totalKomisyonDepo ?? 0.00;
            totalKomisyonRetre = data.totalKomisyonRetre ?? 0.00;
            
            if (data.lisTranzaksyon) {
                lisTranzaksyon = Object.values(data.lisTranzaksyon).sort((a, b) => b.timestamp - a.timestamp);
            } else {
                lisTranzaksyon = [];
            }
            
            if (data.mandeVerifikasyon === true && document.getElementById('verification-popup')) {
                document.getElementById('verification-popup').style.display = 'flex';
                const msgPopup = document.getElementById('modal-msg');
                if (msgPopup) {
                    msgPopup.innerText = `Èske ou dakò ou jwenn ${kobfiziknatcash.toLocaleString('en-US')} HTG nan kès NatCash la?`;
                }
            }
        } else {
            soveDoneSouFirebase();
        }
        updateNatCashDisplays();
        aficheIstorikEkran();
    });

    function soveDoneSouFirebase() {
        let tranzaksyonObj = {};
        lisTranzaksyon.forEach(t => {
            tranzaksyonObj[t.id] = t;
        });

        update(natcashRef, {
            natcashCardBalance: natcashCardBalance,
            kobfiziknatcash: kobfiziknatcash,
            stokBwasonFrijidè: stokBwasonFrijidè,
            stokVenteEnGro: stokVenteEnGro,
            accumulatedCommission: accumulatedCommission,
            totalKomisyonDepo: totalKomisyonDepo,
            totalKomisyonRetre: totalKomisyonRetre,
            lisTranzaksyon: tranzaksyonObj
        });

        updateNatCashDisplays();
        aficheIstorikEkran();
    }

    function jwennPwochenSètèA() {
        let kounye = new Date();
        let demen = new Date(kounye);
        demen.setDate(kounye.getDate() + 1);
        demen.setHours(7, 0, 0, 0);
        return demen;
    }

    let datPemanKomisyon = jwennPwochenSètèA();

    function jwennKomisyonDepo(montan) {
        if (montan < 20) return 0;
        if (montan >= 20 && montan <= 99) return 1.65;
        if (montan >= 100 && montan <= 249) return 3.31;
        if (montan >= 250 && montan <= 499) return 4.14;
        if (montan >= 500 && montan <= 999) return 6.20;
        if (montan >= 1000 && montan <= 1999) return 12.40;
        if (montan >= 2000 && montan <= 3999) return 20.60;
        if (montan >= 4000 && montan <= 7999) return 28.93;
        if (montan >= 8000 && montan <= 11999) return 35.00;
        if (montan >= 12000 && montan <= 19999) return 45.00;
        if (montan >= 20000 && montan <= 39999) return 60.00;
        if (montan >= 40000 && montan <= 59999) return 75.00;
        if (montan >= 60000 && montan <= 74999) return 90.00;
        if (montan >= 75000 && montan <= 99999) return 100.00;
        return montan * 0.001;
    }

    function jwennKomisyonRetrè(montan) {
        if (montan < 20) return 0;
        if (montan >= 20 && montan <= 99) return 1.50;
        if (montan >= 100 && montan <= 249) return 3.00;
        if (montan >= 250 && montan <= 499) return 4.50;
        if (montan >= 500 && montan <= 999) return 7.93;
        if (montan >= 1000 && montan <= 1999) return 15.48;
        if (montan >= 2000 && montan <= 3999) return 25.93;
        if (montan >= 4000 && montan <= 7999) return 36.73;
        if (montan >= 8000 && montan <= 11999) return 47.53;
        if (montan >= 12000 && montan <= 19999) return 59.00;
        if (montan >= 20000 && montan <= 39999) return 75.00;
        if (montan >= 40000 && montan <= 59999) return 95.00;
        if (montan >= 60000 && montan <= 74999) return 115.00;
        if (montan >= 75000 && montan <= 99999) return 135.00;
        return montan * 0.0015;
    }

    function updateNatCashDisplays() {
        let cardDisp = document.getElementById('vandes-natcash-display');
        let cashDisp = document.getElementById('vandes-cash-display');
        let stokBwDisp = document.getElementById('kes-gro-display');

        if (cardDisp) {
            cardDisp.innerText = natcashCardBalance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " HTG";
        }
        if (cashDisp) {
            cashDisp.innerText = kobfiziknatcash.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " HTG";
        }
        if (stokBwDisp) {
            stokBwDisp.innerText = stokVenteEnGro.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " HTG";
        }
    }

    function ajouteNanNatLog(mesaj, montan = 0, tip = 'sistèm', komisyon = 0) {
        let id = "t_" + Date.now() + Math.random().toString(36).substr(2, 5);
        let kounye = new Date();
        
        let mwa = String(kounye.getMonth() + 1).padStart(2, '0');
        let jou = String(kounye.getDate()).padStart(2, '0');
        let datFòma = `${kounye.getFullYear()}-${mwa}-${jou}`;

        if (tip !== 'sistèm') {
            lisTranzaksyon.unshift({ 
                id: id, 
                mesaj: mesaj, 
                montan: montan, 
                tip: tip, 
                komisyon: komisyon, 
                tan: kounye.toLocaleTimeString(),
                dat: datFòma,
                timestamp: Date.now()
            });
        }
        soveDoneSouFirebase();
    }

    function aficheIstorikEkran() {
        const logDiv = document.getElementById('pos-nat-logs');
        if (!logDiv) return;
        
        if (lisTranzaksyon.length === 0) {
            logDiv.innerHTML = "Pa gen tranzaksyon...";
            return;
        }
        
        let htmlKontni = "";
        lisTranzaksyon.forEach(t => {
            let ikòn = t.tip === 'depo' ? '📥' : '📤';
            htmlKontni += `<div onclick="manijeTranzaksyon('${t.id}')" style="cursor: pointer; padding: 4px; border-bottom: 1px dashed #ddd; transition: background 0.2s;" onmouseover="this.style.backgroundColor='#eaeaea'" onmouseout="this.style.backgroundColor='transparent'">
                ⏰ ${t.tan} - ${ikòn} <strong>${t.tip.toUpperCase()}:</strong> ${t.mesaj} (Klike pou w modifye/suprime)
            </div>`;
        });
        
        logDiv.innerHTML = htmlKontni;
    }

    function manijeTranzaksyon(id) {
        let tIndex = lisTranzaksyon.findIndex(item => item.id === id);
        if (tIndex === -1) return;
        
        let tranzaksyon = lisTranzaksyon[tIndex];
        let aksyon = prompt(`Opsyon pou tranzaksyon ${tranzaksyon.tip.toUpperCase()} ki te fèt a ${tranzaksyon.tan}:\n\nEkri "SUPRIME" pou w efase l.\nEkri "MODIFYE" pou w chanje montan an.`);
        
        if (!aksyon) return;
        
        if (aksyon.toUpperCase() === "SUPRIME") {
            if (tranzaksyon.tip === 'depo') {
                natcashCardBalance += tranzaksyon.montan;
                kobfiziknatcash -= tranzaksyon.montan;
                totalKomisyonDepo -= tranzaksyon.komisyon;
            } else if (tranzaksyon.tip === 'retre') {
                natcashCardBalance -= tranzaksyon.montan;
                kobfiziknatcash += tranzaksyon.montan;
                totalKomisyonRetre -= tranzaksyon.komisyon;
            }
            accumulatedCommission -= tranzaksyon.komisyon;
            
            lisTranzaksyon.splice(tIndex, 1);
            alert("Tranzaksyon an suprime ak siksè, balans yo retounen nan plas yo!");
            
        } else if (aksyon.toUpperCase() === "MODIFYE") {
            let nouvoMontanKòd = prompt(`Montan aktyèl la se ${tranzaksyon.montan} HTG. Antre nouvo montan an:`);
            let nouvoMontan = parseFloat(nouvoMontanKòd);
            
            if (isNaN(nouvoMontan) || nouvoMontan <= 0) {
                alert("⚠️ Nouvo montan an pa valab!");
                return;
            }
            
            if (tranzaksyon.tip === 'depo') {
                natcashCardBalance += tranzaksyon.montan;
                kobfiziknatcash -= tranzaksyon.montan;
                totalKomisyonDepo -= tranzaksyon.komisyon;
            } else if (tranzaksyon.tip === 'retre') {
                natcashCardBalance -= tranzaksyon.montan;
                kobfiziknatcash += tranzaksyon.montan;
                totalKomisyonRetre -= tranzaksyon.komisyon;
            }
            accumulatedCommission -= tranzaksyon.komisyon;
            
            tranzaksyon.montan = nouvoMontan;
            if (tranzaksyon.tip === 'depo') {
                tranzaksyon.komisyon = jwennKomisyonDepo(nouvoMontan);
                natcashCardBalance -= nouvoMontan;
                kobfiziknatcash += nouvoMontan;
                totalKomisyonDepo += tranzaksyon.komisyon;
                tranzaksyon.mesaj = `Kliyan voye ${nouvoMontan} HTG (Komisyon an rezèv: +${tranzaksyon.komisyon.toFixed(2)} HTG) [Modifye]`;
            } else if (tranzaksyon.tip === 'retre') {
                tranzaksyon.komisyon = jwennKomisyonRetrè(nouvoMontan);
                natcashCardBalance += nouvoMontan;
                kobfiziknatcash -= nouvoMontan;
                totalKomisyonRetre += tranzaksyon.komisyon;
                tranzaksyon.mesaj = `Kliyan retire ${nouvoMontan} HTG (Komisyon an rezèv: +${tranzaksyon.komisyon.toFixed(2)} HTG) [Modifye]`;
            }
            accumulatedCommission += tranzaksyon.komisyon;
            alert("Tranzaksyon an modifye ak siksè!");
        }
        
        soveDoneSouFirebase();
    }

    function manijeKòbFizikKach() {
        let chwa = prompt(`Manadjman Kòb Fizik (NatCash Kach):\n\nEkri "AJOUTE" pou pran kòb nan Stok Vann en Gro (BW) la mete la.\nEkri "RETIRE" pou w pran lajan nan kès la.`);
        
        if (!chwa) return;
        
        if (chwa.toUpperCase() === "AJOUTE") {
            let konfimasyon = confirm("Èske ou vle pran kach nan STOK VANN EN GRO A (BW) pou mete nan kòb kach NatCash la?");
            if (!konfimasyon) return;

            let montanKòd = prompt(`Stok BW aktyèl: ${stokVenteEnGro} HTG.\nAntre montan w ap pran ladan l lan:`);
            let montan = parseFloat(montanKòd);
            if (isNaN(montan) || montan <= 0) {
                alert("⚠️ Montan sa a pa valab!");
                return;
            }
            
            if (stokVenteEnGro < montan) {
                alert(`❌ Pa gen ase kòb nan Stok Vann en Gro (BW)! Ou sèlman gen ${stokVenteEnGro} HTG.`);
                return;
            }

            stokVenteEnGro -= montan;
            kobfiziknatcash += montan;
            
            ajouteNanNatLog(`SISTÈM: Yo pran ${montan} HTG nan Stok En Gro (BW) pou ranfòse Kach NatCash la.`, 0, 'sistèm', 0);
            alert(`Siksè! ${montan.toFixed(2)} HTG pran nan Stok BW epi li ajoute nan Kòb Fizik NatCash la.`);
            
        } else if (chwa.toUpperCase() === "RETIRE") {
            let montanKòd = prompt("Antre montan w ap retire nan kès fizik la:");
            let montan = parseFloat(montanKòd);
            if (isNaN(montan) || montan <= 0) {
                alert("⚠️ Montan sa a pa valab!");
                return;
            }
            if (kobfiziknatcash < montan) {
                alert("❌ Pa gen ase kòb fizik pou w retire montan sa a!");
                return;
            }
            
            let destinasyon = prompt("Ki kote lajan sa a ap ale? (Pa egzanp: BW, Depans, elatriye):");
            if (!destinasyon) destinasyon = "BW";
            
            if (destinasyon.toUpperCase() === "BW") {
                stokVenteEnGro += montan;
            }
            
            kobfiziknatcash -= montan;
            alert(`Ou retire ${montan.toFixed(2)} HTG nan Kòb Fizik la. Direksyon: ${destinasyon.toUpperCase()}. Sove pou kès admin an pita!`);
        }
        
        soveDoneSouFirebase();
    }

    function acceptFonDeKes() {
        alert("Mèsi! Ou valide kès la ak siksè.");
        document.getElementById('verification-popup').style.display = 'none';
        update(natcashRef, { mandeVerifikasyon: false });
    }

    function showDisputeInput() {
        document.getElementById('modal-initial-btns').style.display = 'none';
        document.getElementById('dispute-section').style.display = 'block';
    }

    function submitDispute() {
        let disputedAmt = document.getElementById('disputed-amount-input').value;
        if (!disputedAmt || parseFloat(disputedAmt) < 0) {
            alert("Tanpri antre yon kantite kòb ki valab.");
            return;
        }
        
        alert(`Kontestasyon voye bay Admin! Ou deklare ou jwenn: ${disputedAmt} HTG olye de ${kobfiziknatcash} HTG.`);
        document.getElementById('verification-popup').style.display = 'none';
        
        update(natcashRef, { 
            mandeVerifikasyon: false,
            kontestasyonKès: {
                dat: new Date().toLocaleString(),
                kòbSistèm: kobfiziknatcash,
                kòbMounNanWè: parseFloat(disputedAmt)
            }
        });
    }

    setInterval(function tchekePemanKomisyon() {
        let kounye = new Date();
        if (kounye >= datPemanKomisyon) {
            // Lojik transfè otomatik la mete AN POZ pou kounye a.
            // Sistèm nan p ap ajoute kòb la sou balans kat la e li p ap efase varyab yo a 7H.
            /*
            if (accumulatedCommission > 0) {
                natcashCardBalance += accumulatedCommission;
                accumulatedCommission = 0.00;
                totalKomisyonDepo = 0.00;
                totalKomisyonRetre = 0.00;
                ajouteNanNatLog(`SISTÈM (7:00 AM): Komisyon jounen an depoze sou kat la!`, 0, 'sistèm', 0);
            }
            */
            datPemanKomisyon = jwennPwochenSètèA();
        }
    }, 1000);

    function processNatCash(type) {
        const amountInput = document.getElementById('nat-amount');
        if (!amountInput) return;

        let montan = parseFloat(amountInput.value);

        if (isNaN(montan) || montan <= 0) {
            alert("⚠️ Tanpri antre yon montan ki valab!");
            return;
        }

        if (type === 'depo') {
            if (natcashCardBalance < montan) {
                alert("❌ Ou pa gen ase balans sou kat la pou fè depo sa a!");
                return;
            }
            let komisyon = jwennKomisyonDepo(montan);
            natcashCardBalance -= montan;
            kobfiziknatcash += montan;
            accumulatedCommission += komisyon;
            totalKomisyonDepo += komisyon;
            ajouteNanNatLog(`Kliyan voye ${montan} HTG (Komisyon an rezèv: +${komisyon.toFixed(2)} HTG)`, montan, 'depo', komisyon);
            
        } else if (type === 'retre') {
            if (kobfiziknatcash < montan) {
                alert("❌ Ou pa gen ase kòb fizik (Kach) pou remèt kliyan an!");
                return;
            }
            let komisyon = jwennKomisyonRetrè(montan);
            natcashCardBalance += montan;
            kobfiziknatcash -= montan;
            accumulatedCommission += komisyon;
            totalKomisyonRetre += komisyon;
            ajouteNanNatLog(`Kliyan retire ${montan} HTG (Komisyon an rezèv: +${komisyon.toFixed(2)} HTG)`, montan, 'retre', komisyon);
        }

        amountInput.value = '';
        soveDoneSouFirebase();
    }

    window.processNatCash = processNatCash;
    window.manijeTranzaksyon = manijeTranzaksyon;
    window.manijeKòbFizikKach = manijeKòbFizikKach;
    window.acceptFonDeKes = acceptFonDeKes;
    window.showDisputeInput = showDisputeInput;
    window.submitDispute = submitDispute;
    window.toggleTheme = toggleTheme;

    updateNatCashDisplays();
    aficheIstorikEkran();
</script>
