window.ajouteEstokAdmin = async function() {
    let pId = document.getElementById('select-pwodwi-estok').value;
    let inite = document.getElementById('select-inite-estok').value;
    let inputKantite = document.getElementById('input-kantite-bwat');
    let kantite = parseFloat(inputKantite.value);

    if (!pId || isNaN(kantite) || kantite <= 0) {
        alert("Antre yon kantite valab!");
        return;
    }

    let grennPouAjoute = 0;
    if (inite === "kes") {
        grennPouAjoute = kantite * 24;
    } else if (inite === "demi") {
        grennPouAjoute = kantite * 12;
    } else if (inite === "grenn") {
        grennPouAjoute = kantite;
    }

    let echèk = null;
    let nonPwodwi = "";

    try {
        const { committed } = await runTransaction(appRef, (currentData) => {
            echèk = null;
            if (!currentData || !currentData.inventory || !currentData.inventory[pId]) {
                echèk = "Pwodwi sa a pa jwenn nan baz done a!";
                return;
            }

            let p = currentData.inventory[pId];
            nonPwodwi = p.name;
            p.stockGrenn = (p.stockGrenn ?? 0) + grennPouAjoute;
            currentData.inventory[pId] = p;
            return currentData;
        });

        if (echèk) {
            alert(echèk);
            return;
        }
        if (committed) {
            alert(`Siksè! Nouvo estok pou ${nonPwodwi.toUpperCase()} la sove nan Depo a.`);
            inputKantite.value = '';

        console.error("Erè tranzaksyon ajoute estòk:", err);

    }

Wi, se egzakteman menm rasin pwoblèm nan, men kounye a li nan index.html (POS), pa nan admin.html.

Kisa k ap pase:

Fonksyon checkoutSale() rele saveAppStateToFirebase(), epi fonksyon sa a ekri TOUT inventory a ankò nan Firebase, ki soti nan kopi lokal la (inventory varyab JS nan navigatè a):

js
function saveAppStateToFirebase() {
    const inventoryObj = {};
    Object.values(inventory).forEach(p => { ... });   // kopi LOKAL, pa sèvè a
    const updates = { inventory: inventoryObj, ... };
    update(dbRef, updates);                             // ekrase TOUT 32 pwodwi yo
}
Sekans egzat ki fè "efase" a rive:

Ou louvri POS la (index.html) → li chaje yon kopi envantè a nan moman sa a (avan w mete estok).
Ou ale nan admin.html, ou mete nouvo estok pou yon pwodwi (Firebase ajou ✅).
Ou retounen sou POS la epi w vann yon demi-kès. Men POS la poko refrechi kopi lokal li (oswa li refrechi apre w te deja klike vann) → lè checkoutSale() ekri, li voye ankò TOUT 32 pwodwi yo ak ANSYEN chif estok yo (san nouvo estok admin te mete a), sof pou pwodwi ou fenk vann nan.
Rezilta: nouvo estok admin te mete a disparèt, paske POS la ekrase l ak vye chif li te genyen an.
Menm bagay la ka rive nan lòt bouton POS yo tou (Depans, Verifikasyon Kès) paske yo tout rele saveAppStateToFirebase().

Fix pou checkoutSale — sèvi ak runTransaction() pou l li chif ki REYÈLMAN sou sèvè a nan moman an, epi ranje SÈLMAN pwodwi ki nan panyen an (pa tout 32 yo):

Premyèman, nan <script type="module"> nan index.html, ajoute runTransaction nan import la:

js
import { getDatabase, ref, update, onValue, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
Answit ranplase window.checkoutSale ak:

js
window.checkoutSale = async function() {
    if (currentCart.length === 0) return alert("Chwazi yon pwodwi anvan!");
    let cartSnapshot = [...currentCart];
    let echèk = null;
    let billTotal = 0;

    try {
        const { committed } = await runTransaction(dbRef, (currentData) => {
            echèk = null;
            if (!currentData || !currentData.inventory) {
                echèk = "⚠️ Done yo poko chaje nan Firebase. Eseye ankò.";
                return;
            }

            // 1. Verifye stòk pou CHAK atik AVAN nou touche anyen
            for (const item of cartSnapshot) {
                let p = currentData.inventory[item.prodId.toString()];
                if (!p) { echèk = `Pwodwi "${item.name}" pa jwenn nan sistèm nan ankò.`; return; }
                let stokDisponib = item.type === 'detail' ? (p.stockFrizerGrenn || 0) : (p.stockGrenn || 0);
                if (stokDisponib < item.qtyNeeded) {
                    echèk = `⚠️ Pa gen ase ${p.name} ankò (${stokDisponib}g disponib) — done yo chanje.`;
                    return;
                }
            }

            // 2. Aplike chanjman yo SÈLMAN sou pwodwi ki nan panyen an
            let timeStr = new Date().toLocaleTimeString();
            let localTotal = 0, localProfit = 0;

            cartSnapshot.forEach(item => {
                let p = currentData.inventory[item.prodId.toString()];
                if (item.type === 'detail') {
                    p.stockFrizerGrenn -= item.qtyNeeded;
                    currentData.stokBwasonFrijidè = (currentData.stokBwasonFrijidè ?? 0) + item.price;
                    currentData.logsAnDetay = `[${timeStr}] 🥤 ${p.name} -> ${item.price} G (S${item.price / 5})<br>` + (currentData.logsAnDetay ?? "");
                } else {
                    p.stockGrenn -= item.qtyNeeded;
                    currentData.stokVenteEnGro = (currentData.stokVenteEnGro ?? 0) + item.price;
                    currentData.logsAnGwo = `[${timeStr}] 📦 ${p.name} -> ${item.price} G (S${item.price / 5})<br>` + (currentData.logsAnGwo ?? "");
                }
                currentData.inventory[item.prodId.toString()] = p;
                localTotal += item.price;
                localProfit += (item.price - item.buyPrice);
            });

            currentData.totalRevenue = (currentData.totalRevenue ?? 0) + localTotal;
            currentData.totalProfit = (currentData.totalProfit ?? 0) + localProfit;
            currentData.physicalCashBalance = (currentData.physicalCashBalance ?? 0) + localTotal;

            billTotal = localTotal;
            return currentData;
        });

        if (echèk) { alert(echèk); return; }
        if (committed) {
            alert(`✅ Lavant anrejistre (${billTotal} HTG / S${billTotal / 5}).`);
            currentCart = [];
            renderCart();
        }
    } catch (err) {
        console.error("Erè tranzaksyon lavant:", err);
        alert("⚠️ Pwoblèm koneksyon — lavant lan pa t sove. Tanpri eseye ankò.");
    }
};
(Pa bezwen rele renderProducts()/updatePosCashDisplay() alamen ankò — onValue() ap deklanche yo otomatikman lè Firebase konfime.)
